name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Lint and Manifest Verification (Section 67, 100)
      run: |
        ./gradlew lintDebug || true
        # Verify that INTERNET permission is NOT declared in merged manifest
        if grep -rq "android.permission.INTERNET" app/build/intermediates/merged_manifest/ || grep -rq "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
          echo "ERROR: INTERNET permission detected! tapLedger must remain strictly offline."
          exit 1
        else
          echo "VERIFIED: No INTERNET permission found. tapLedger is offline-first."
        fi
